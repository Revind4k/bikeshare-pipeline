version: 2

models:
  - name: fct_trips
    description: One row per valid ride.
    columns:
      - name: ride_id
        data_tests: [unique, not_null]
      - name: rider_type
        data_tests:
          - accepted_values:
              arguments: {values: [member, casual]}
      - name: rideable_type
        data_tests:
          - accepted_values:
              arguments: {values: [classic_bike, electric_bike]}
      - name: duration_s
        data_tests:
          - in_range:
              arguments: {min_value: "{{ var('min_trip_seconds') }}", max_value: "{{ var('max_trip_hours') * 3600 }}"}
      - name: start_station_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_stations'), field: station_id}
              config: {where: "start_station_id is not null"}
      - name: end_station_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_stations'), field: station_id}
              config: {where: "end_station_id is not null"}

  - name: dim_stations
    columns:
      - name: station_id
        data_tests: [unique, not_null]
      - name: station_name
        data_tests: [not_null]
      - name: city
        data_tests:
          - accepted_values:
              arguments: {values: [Jersey City, Hoboken, New York]}
      - name: lat
        data_tests:
          - in_range:
              arguments: {min_value: 40.5, max_value: 41.0}
      - name: lng
        data_tests:
          - in_range:
              arguments: {min_value: -74.3, max_value: -73.7}

  - name: fct_daily_ridership
    columns:
      - name: ride_date
        data_tests: [unique, not_null]
      - name: weather
        data_tests:
          - accepted_values:
              arguments: {values: [dry, light_rain, heavy_rain, snow]}

  - name: rpt_temperature_effect
    description: Dry-day ridership by 5 °C band of the daily high, split by weekday/weekend.
    columns:
      - name: temp_band
        data_tests: [not_null]

unit_tests:
  - name: classifies_trip_quality
    description: Each exclusion rule fires on its own boundary, and undocked e-bike rides stay valid.
    model: int_trips_classified
    given:
      - input: ref('stg_trips')
        rows:
          - {ride_id: ok,       started_at: "2026-09-01 08:00:00", ended_at: "2026-09-01 08:15:00", end_station_id: JC001}
          - {ride_id: undocked, started_at: "2026-09-01 08:00:00", ended_at: "2026-09-01 08:15:00", end_station_id: null}
          - {ride_id: at_60s,   started_at: "2026-09-01 08:00:00", ended_at: "2026-09-01 08:01:00", end_station_id: JC001}
          - {ride_id: at_59s,   started_at: "2026-09-01 08:00:00", ended_at: "2026-09-01 08:00:59", end_station_id: JC001}
          - {ride_id: backward, started_at: "2026-09-01 08:00:00", ended_at: "2026-09-01 07:59:00", end_station_id: JC001}
          - {ride_id: lost,     started_at: "2026-09-01 08:00:00", ended_at: "2026-09-02 08:00:01", end_station_id: JC001}
          - {ride_id: no_end,   started_at: "2026-09-01 08:00:00", ended_at: null,                  end_station_id: null}
    expect:
      rows:
        - {ride_id: ok,       quality_flag: valid,                 ended_at_station: true}
        - {ride_id: undocked, quality_flag: valid,                 ended_at_station: false}
        - {ride_id: at_60s,   quality_flag: valid,                 ended_at_station: true}
        - {ride_id: at_59s,   quality_flag: false_start,           ended_at_station: true}
        - {ride_id: backward, quality_flag: ends_before_start,     ended_at_station: true}
        - {ride_id: lost,     quality_flag: over_max_duration,     ended_at_station: true}
        - {ride_id: no_end,   quality_flag: unparseable_timestamp, ended_at_station: false}

  - name: keeps_one_copy_of_month_boundary_rides
    model: stg_trips
    given:
      - input: ref('base_trips')
        rows:
          - {ride_id: r1, started_at: "2026-08-31 23:50:00", ended_at: "2026-09-01 00:10:00", filename: "data/raw/trips/202609.csv"}
          - {ride_id: r1, started_at: "2026-08-31 23:50:00", ended_at: "2026-09-01 00:10:00", filename: "data/raw/trips/202608.csv"}
          - {ride_id: r2, started_at: "2026-09-02 10:00:00", ended_at: "2026-09-02 10:20:00", filename: "data/raw/trips/202609.csv"}
    expect:
      rows:
        - {ride_id: r1, source_month: "202608"}
        - {ride_id: r2, source_month: "202609"}

  - name: bands_temperatures_at_their_edges
    description: Each band includes its lower edge, sub-zero and very hot days get their own bands, and wet days are left out.
    model: rpt_temperature_effect
    given:
      - input: ref('fct_daily_ridership')
        rows:
          - {weather: dry,        is_weekend: false, temp_max_c: -0.1, rides: 100, member_rides: 90, casual_rides: 10}
          - {weather: dry,        is_weekend: false, temp_max_c: 0.0,  rides: 200, member_rides: 180, casual_rides: 20}
          - {weather: dry,        is_weekend: false, temp_max_c: 4.9,  rides: 400, member_rides: 360, casual_rides: 40}
          - {weather: dry,        is_weekend: false, temp_max_c: 5.0,  rides: 500, member_rides: 400, casual_rides: 100}
          - {weather: dry,        is_weekend: false, temp_max_c: 35.0, rides: 300, member_rides: 240, casual_rides: 60}
          - {weather: heavy_rain, is_weekend: false, temp_max_c: 20.0, rides: 50,  member_rides: 45, casual_rides: 5}
    expect:
      rows:
        - {band_order: 0, temp_band: "< 0 °C",  is_weekend: false, days: 1, avg_rides: 100, casual_pct: 10.0}
        - {band_order: 1, temp_band: "0–5 °C",  is_weekend: false, days: 2, avg_rides: 300, casual_pct: 10.0}
        - {band_order: 2, temp_band: "5–10 °C", is_weekend: false, days: 1, avg_rides: 500, casual_pct: 20.0}
        - {band_order: 8, temp_band: "≥ 35 °C", is_weekend: false, days: 1, avg_rides: 300, casual_pct: 20.0}
